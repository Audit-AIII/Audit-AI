[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inkloom-api"
version = "0.1.0"
description = "INKLOOM AI backend: auth, tenancy, orchestration, versioning, approval, audit"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic[email]>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "bcrypt>=4.2,<5",
  "PyJWT>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.12,<1",
  "pypdf>=6.21.2,<7",  # >=6.21.2: fixes crafted-PDF DoS advisories (pip-audit, 2026-10-24)
  "python-docx>=1.1,<2",
  "google-genai>=1.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Released migrations are never edited.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM"]
# UP038 is deprecated in ruff: `isinstance(x, (A, B))` stays.
ignore = ["UP038"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and request parameters as default values by design; the two
# inkloom_api factories return a `Depends(...)`.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "inkloom_api.auth.dependencies.require_permission",
    "inkloom_api.rate_limit.rate_limited_submit_permission",
]
