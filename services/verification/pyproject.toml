[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inkloom-verify"
version = "0.1.0"
description = "INKLOOM AI claim-verification engine"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "rank_bm25>=0.2.2,<0.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
