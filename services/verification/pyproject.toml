[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inkloom-verify"
version = "0.1.0"
description = "INKLOOM AI claim-verification engine"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "rank_bm25>=0.2.2,<0.3", "httpx>=0.27,<1"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1"]
dev = ["pytest>=8", "pip-audit>=2.7", "jsonschema>=4.20,<5", "fastapi>=0.115,<1", "uvicorn>=0.32,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Versioned prompt files and the lock of released versions (prompts/loader.py).
inkloom_verify = ["prompts/*.txt", "prompts/prompts.lock.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
