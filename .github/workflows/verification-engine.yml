# CI for Member 2's verification engine only (services/verification).
# No secrets and no live LLM calls: the evaluation gates run on the deterministic sections.
# Other members' code is not built here; they can add their own workflows.
name: verification-engine

on:
  push:
    paths:
      - "services/verification/**"
      - ".github/workflows/verification-engine.yml"
  pull_request:
    paths:
      - "services/verification/**"
      - ".github/workflows/verification-engine.yml"

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: services/verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (exact versions from constraints.txt)
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Evaluation with regression gates (fails on regression or a changed label lock)
        run: python eval/run_eval.py --check-baseline --out reports/ci
      - name: Dependency audit
        # pip-audit checks the whole environment. Python 3.11's venv ships an old setuptools with
        # known advisories (65.5.0: PYSEC-2022-43012, PYSEC-2025-49, ...) that the 3.12 lane does
        # not have; the 3.11 audit failed on 3595e96. Upgrade the environment's own tools first.
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip_audit
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-py${{ matrix.python-version }}
          path: services/verification/reports/ci
